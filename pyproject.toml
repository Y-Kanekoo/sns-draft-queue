[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sns-draft-queue"
version = "0.1.0"
description = "人間の承認を必須にする SNS 下書きキュー"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sns-queue = "sns_draft_queue.cli:main"

[dependency-groups]
dev = ["ruff>=0.11", "mypy>=1.15", "pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/sns_draft_queue"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
